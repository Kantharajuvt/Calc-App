<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Calculator Application</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: gradientShift 10s ease infinite;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
      background-size: 400% 400%;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.2);
      width: 400px;
      text-align: center;
    }
    h1 { color: #333; margin-bottom: 20px; }
    .result-box {
      background: #f0f8ff;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid #d0e7ff;
    }
    .buttons input[type="submit"] {
      padding: 10px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, opacity 0.3s;
      color: white;
    }
    .buttons input[value="ADD"] { background: #28a745; }
    .buttons input[value="SUB"] { background: #dc3545; }
    .buttons input[value="MUL"] { background: #fd7e14; }
    .buttons input[value="DIV"] { background: #007bff; }
	.buttons input[value="MOD"] { background: black }
    .buttons input:hover { opacity: 0.9; transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="container">
    <h1>WELCOME TO CALSI APPLICATION</h1>

    <div class="result-box" th:if="${res != null}">
      <h2>Results</h2>
      <p>Operation: <strong><span th:text="${op}"></span></strong></p>
      <p>Numbers: <span th:text="${n1}"></span> and <span th:text="${n2}"></span></p>
      <p><strong>Result = <span th:text="${res}"></span></strong></p>
    </div>

    <form action="/calculate" method="post">
      <div>
        <label>Num 1</label>
        <input type="number" name="num1" required />
      </div>
      <div>
        <label>Num 2</label>
        <input type="number" name="num2" required />
      </div>
      <div class="buttons">
        <input type="submit" value="ADD" name="operation"/>
        <input type="submit" value="SUB" name="operation"/>
        <input type="submit" value="MUL" name="operation"/>
        <input type="submit" value="DIV" name="operation"/>
		<input type="submit" value="MOD" name="operation"/>

      </div>
    </form>
  </div>
</body>
</html>
